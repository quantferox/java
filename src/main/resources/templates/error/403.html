<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>403 — Lumeo</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="auth-page">
<div class="auth-card" style="text-align:center">
  <a class="brand" th:href="@{/shop}">&#9749; Lumeo</a>
  <div style="font-size:4rem;font-weight:900;color:#ef4444;margin:1rem 0">403</div>
  <h1 style="font-size:1.4rem;margin-bottom:.75rem" th:text="${errorTitle}">Access Denied</h1>
  <p style="color:#6b7280;margin-bottom:1.5rem" th:text="${errorMessage}">You don't have permission.</p>
  <a th:href="@{/shop}" class="btn btn-primary">← Back to Shop</a>
  <a th:href="@{/login}" class="btn btn-outline" style="margin-left:.5rem">Login</a>
</div>
</body>
</html>
