<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Lumeo</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="auth-page">

<div class="auth-card">
  <a class="brand" th:href="@{/shop}">&#9749; Lumeo</a>
  <h1 class="auth-title">Sign In</h1>

  <div class="alert alert-error" th:if="${loginError}" th:text="${loginError}"></div>

  <form method="post" th:action="@{/login}" class="auth-form">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <div class="form-group">
      <label for="username">Username</label>
      <input id="username" type="text" name="username" required
             placeholder="your_username" class="form-control"/>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" required
             placeholder="••••••••" class="form-control"/>
    </div>

    <button type="submit" class="btn btn-primary btn-block">Sign In</button>
  </form>

  <p class="auth-footer">
    Default credentials: <code>admin / admin123</code> or <code>user / user123</code>
  </p>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
