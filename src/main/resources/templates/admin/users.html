<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Users — Lumeo Admin</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body class="admin-body">
<div class="admin-layout">
  <aside class="admin-sidebar">
    <a class="brand" th:href="@{/admin}">&#9749; Lumeo Admin</a>
    <nav class="admin-nav">
      <a th:href="@{/admin}"            class="nav-item">&#128202; Dashboard</a>
      <a th:href="@{/admin/products}"   class="nav-item">&#128722; Products</a>
      <a th:href="@{/admin/categories}" class="nav-item">&#128204; Categories</a>
      <a th:href="@{/admin/orders}"     class="nav-item">&#128230; Orders</a>
      <a th:href="@{/admin/users}"      class="nav-item active">&#128100; Users</a>
    </nav>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <h1>Users</h1>
    </header>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <form method="get" th:action="@{/admin/users}" class="table-search">
      <input type="text" name="q" th:value="${query}" placeholder="Search by username or email…" class="form-control"/>
      <button class="btn btn-primary btn-sm">Search</button>
      <a th:href="@{/admin/users}" class="btn btn-outline btn-sm">Clear</a>
    </form>

    <table class="data-table">
      <thead>
        <tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Enabled</th><th>Actions</th></tr>
      </thead>
      <tbody>
        <tr th:each="u : ${users.content}">
          <td th:text="${u.id}">1</td>
          <td th:text="${u.username}">user</td>
          <td th:text="${u.email}">email</td>
          <td><span class="badge" th:text="${u.role}"
                   th:classappend="${u.role.name() == 'ROLE_ADMIN'} ? 'badge-admin-role' : 'badge-user-role'">ROLE</span></td>
          <td>
            <span th:if="${u.enabled}"  class="badge badge-active">Yes</span>
            <span th:unless="${u.enabled}" class="badge badge-inactive">No</span>
          </td>
          <td class="action-cell">
            <form method="post" th:action="@{/admin/users/{id}/promote(id=${u.id})}" style="display:inline">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button class="btn btn-sm btn-outline"
                      th:disabled="${u.role.name() == 'ROLE_ADMIN'}">Promote</button>
            </form>
            <form method="post"
                  th:action="${u.enabled} ? @{/admin/users/{id}/disable(id=${u.id})} : @{/admin/users/{id}/enable(id=${u.id})}"
                  style="display:inline">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button class="btn btn-sm btn-danger"
                      th:text="${u.enabled} ? 'Disable' : 'Enable'">Toggle</button>
            </form>
          </td>
        </tr>
        <tr th:if="${users.content.isEmpty()}">
          <td colspan="6" class="empty-cell">No users found.</td>
        </tr>
      </tbody>
    </table>

    <nav class="pagination" th:if="${users.totalPages > 1}">
      <a th:href="@{/admin/users(page=${users.page - 1}, q=${query})}"
         th:classappend="${users.first} ? 'disabled'" class="page-link">&laquo;</a>
      <span th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}">
        <a th:href="@{/admin/users(page=${i}, q=${query})}"
           th:text="${i + 1}"
           th:classappend="${i == users.page} ? 'active'" class="page-link">1</a>
      </span>
      <a th:href="@{/admin/users(page=${users.page + 1}, q=${query})}"
         th:classappend="${users.last} ? 'disabled'" class="page-link">&raquo;</a>
    </nav>
  </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
