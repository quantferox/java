<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Order Detail — Lumeo Admin</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body class="admin-body">
<div class="admin-layout">
  <aside class="admin-sidebar">
    <a class="brand" th:href="@{/admin}">&#9749; Lumeo Admin</a>
    <nav class="admin-nav">
      <a th:href="@{/admin}"            class="nav-item">&#128202; Dashboard</a>
      <a th:href="@{/admin/products}"   class="nav-item">&#128722; Products</a>
      <a th:href="@{/admin/categories}" class="nav-item">&#128204; Categories</a>
      <a th:href="@{/admin/orders}"     class="nav-item active">&#128230; Orders</a>
      <a th:href="@{/admin/users}"      class="nav-item">&#128100; Users</a>
    </nav>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <h1>Order <span th:text="${order.orderNumber}">ORD</span></h1>
      <a th:href="@{/admin/orders}" class="btn btn-outline btn-sm">← Orders</a>
    </header>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <div class="order-detail-grid">

      <!-- Info -->
      <section class="admin-section">
        <h2>Details</h2>
        <dl class="detail-list">
          <dt>Customer</dt>   <dd th:text="${order.userFullName}">Name</dd>
          <dt>Status</dt>
          <dd><span class="badge" th:text="${order.status}"
                   th:classappend="'badge-' + ${order.status.toString().toLowerCase()}">PENDING</span></dd>
          <dt>Total</dt>      <dd th:text="'$' + ${order.totalAmount}">$0</dd>
          <dt>Placed</dt>     <dd th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}">Date</dd>
          <dt>Notes</dt>      <dd th:text="${order.notes} ?: '—'">—</dd>
        </dl>
      </section>

      <!-- Shipping -->
      <section class="admin-section">
        <h2>Shipping Address</h2>
        <address>
          <p th:text="${order.shippingStreet}">Street</p>
          <p th:text="${order.shippingCity + ', ' + (order.shippingState ?: '')}">City</p>
          <p th:text="${order.shippingZip + ' ' + order.shippingCountry}">ZIP Country</p>
        </address>
      </section>

      <!-- Status change -->
      <section class="admin-section">
        <h2>Update Status</h2>
        <form th:action="@{/admin/orders/{id}/status(id=${order.id})}"
              th:object="${statusReq}"
              method="post" class="inline-form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <select th:field="*{status}" class="form-control">
            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}">Status</option>
          </select>
          <button class="btn btn-primary btn-sm">Update</button>
        </form>
      </section>
    </div>

    <!-- Items -->
    <section class="admin-section">
      <h2>Order Items</h2>
      <table class="data-table">
        <thead>
          <tr><th>Product</th><th>Unit Price</th><th>Qty</th><th>Subtotal</th></tr>
        </thead>
        <tbody>
          <tr th:each="item : ${order.items}">
            <td th:text="${item.productName}">Product</td>
            <td th:text="'$' + ${item.unitPrice}">$0</td>
            <td th:text="${item.quantity}">1</td>
            <td th:text="'$' + ${item.subtotal}">$0</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td colspan="3" class="total-label">Total</td>
            <td th:text="'$' + ${order.totalAmount}" class="total-value">$0</td>
          </tr>
        </tfoot>
      </table>
    </section>
  </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
