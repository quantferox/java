<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${isNew} ? 'New Product' : 'Edit Product'">Product Form — Lumeo Admin</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body class="admin-body">
<div class="admin-layout">
  <aside class="admin-sidebar">
    <a class="brand" th:href="@{/admin}">&#9749; Lumeo Admin</a>
    <nav class="admin-nav">
      <a th:href="@{/admin}"           class="nav-item">&#128202; Dashboard</a>
      <a th:href="@{/admin/products}"  class="nav-item active">&#128722; Products</a>
      <a th:href="@{/admin/categories}" class="nav-item">&#128204; Categories</a>
      <a th:href="@{/admin/orders}"    class="nav-item">&#128230; Orders</a>
      <a th:href="@{/admin/users}"     class="nav-item">&#128100; Users</a>
    </nav>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <h1 th:text="${isNew} ? 'New Product' : 'Edit Product'">Product</h1>
      <a th:href="@{/admin/products}" class="btn btn-outline btn-sm">← Back</a>
    </header>

    <form th:action="${isNew} ? @{/admin/products/new} : @{/admin/products/{id}/edit(id=${productId})}"
          th:object="${product}"
          method="post"
          class="admin-form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="form-row">
        <div class="form-group">
          <label for="name">Name *</label>
          <input id="name" type="text" th:field="*{name}" class="form-control"
                 th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
          <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>
        <div class="form-group">
          <label for="sku">SKU *</label>
          <input id="sku" type="text" th:field="*{sku}" class="form-control"
                 th:classappend="${#fields.hasErrors('sku')} ? 'is-invalid'"/>
          <span class="field-error" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}"></span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="slug">Slug *</label>
          <input id="slug" type="text" th:field="*{slug}" class="form-control"
                 th:classappend="${#fields.hasErrors('slug')} ? 'is-invalid'"/>
          <span class="field-error" th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}"></span>
        </div>
        <div class="form-group">
          <label for="categoryId">Category *</label>
          <select id="categoryId" th:field="*{categoryId}" class="form-control"
                  th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid'">
            <option value="">-- Select --</option>
            <option th:each="cat : ${categories}"
                    th:value="${cat.id}"
                    th:text="${cat.name}">Cat</option>
          </select>
          <span class="field-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="price">Price *</label>
          <input id="price" type="number" step="0.01" th:field="*{price}" class="form-control"
                 th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"/>
          <span class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
        </div>
        <div class="form-group">
          <label for="comparePrice">Compare Price</label>
          <input id="comparePrice" type="number" step="0.01" th:field="*{comparePrice}" class="form-control"/>
        </div>
        <div class="form-group">
          <label for="stockQuantity">Stock *</label>
          <input id="stockQuantity" type="number" th:field="*{stockQuantity}" class="form-control"
                 th:classappend="${#fields.hasErrors('stockQuantity')} ? 'is-invalid'"/>
          <span class="field-error" th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}"></span>
        </div>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" th:field="*{description}" class="form-control" rows="4"></textarea>
      </div>

      <div class="form-group">
        <label for="imageUrl">Image URL</label>
        <input id="imageUrl" type="text" th:field="*{imageUrl}" class="form-control" placeholder="https://..."/>
      </div>

      <div class="form-row checkbox-row">
        <label class="checkbox-label">
          <input type="checkbox" th:field="*{active}"/> Active
        </label>
        <label class="checkbox-label">
          <input type="checkbox" th:field="*{featured}"/> Featured
        </label>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary"
                th:text="${isNew} ? 'Create Product' : 'Save Changes'">Save</button>
        <a th:href="@{/admin/products}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
