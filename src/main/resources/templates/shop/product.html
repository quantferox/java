<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${product.name} + ' — Lumeo'">Product — Lumeo</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<nav class="navbar">
  <div class="container nav-inner">
    <a class="brand" th:href="@{/shop}">&#9749; Lumeo</a>
    <ul class="nav-links">
      <li><a th:href="@{/shop}">← Back to Shop</a></li>
      <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/admin}" class="badge-admin">Admin</a></li>
      <li sec:authorize="isAnonymous()"><a th:href="@{/login}" class="btn btn-outline btn-sm">Login</a></li>
      <li sec:authorize="isAuthenticated()">
        <form method="post" th:action="@{/logout}" style="display:inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button class="btn btn-outline btn-sm">Logout</button>
        </form>
      </li>
    </ul>
  </div>
</nav>

<main class="container main-content">

  <!-- ── Breadcrumb ─────────────────────────────────────────────────────── -->
  <nav class="breadcrumb">
    <a th:href="@{/shop}">Shop</a>
    <span class="sep">/</span>
    <a th:href="@{/shop/category/{slug}(slug=${product.categoryName.toLowerCase().replace(' ','-')})}"
       th:text="${product.categoryName}">Category</a>
    <span class="sep">/</span>
    <span th:text="${product.name}">Product</span>
  </nav>

  <!-- ── Product detail ────────────────────────────────────────────────── -->
  <div class="product-detail">
    <div class="product-gallery">
      <img th:src="${product.imageUrl} ?: '/images/placeholder.png'"
           th:alt="${product.name}" class="detail-img"/>
    </div>

    <div class="product-meta">
      <span class="product-category" th:text="${product.categoryName}">Category</span>
      <h1 class="detail-title" th:text="${product.name}">Product Name</h1>
      <p class="detail-sku">SKU: <span th:text="${product.sku}">SKU-001</span></p>

      <div class="price-row">
        <span class="detail-price" th:text="'$' + ${product.price}">$0.00</span>
        <span class="compare-price"
              th:if="${product.comparePrice != null}"
              th:text="'Was $' + ${product.comparePrice}">Was $0</span>
      </div>

      <div class="badges">
        <span class="badge badge-sale"     th:if="${product.onSale}">On Sale</span>
        <span class="badge badge-featured" th:if="${product.featured}">Featured</span>
        <span class="badge badge-oos"      th:unless="${product.inStock}">Out of Stock</span>
        <span class="badge badge-in"       th:if="${product.inStock}">In Stock</span>
      </div>

      <p class="detail-desc" th:text="${product.description}">Description here.</p>

      <div class="stock-info" th:if="${product.inStock}">
        <p><strong th:text="${product.stockQuantity}">0</strong> units available</p>
      </div>

      <!-- Admin quick-edit link -->
      <div sec:authorize="hasRole('ADMIN')" class="admin-actions">
        <a th:href="@{/admin/products/{id}/edit(id=${product.id})}"
           class="btn btn-outline btn-sm">Edit in Admin</a>
      </div>
    </div>
  </div>

  <!-- ── Related products ──────────────────────────────────────────────── -->
  <section th:if="${!related.isEmpty()}" class="related-section">
    <h2 class="section-title">You may also like</h2>
    <div class="product-grid">
      <article th:each="p : ${related}" class="product-card">
        <a th:href="@{/shop/product/{slug}(slug=${p.slug})}">
          <img th:src="${p.imageUrl} ?: '/images/placeholder.png'"
               th:alt="${p.name}" class="product-img"/>
        </a>
        <div class="product-info">
          <h3 class="product-name">
            <a th:href="@{/shop/product/{slug}(slug=${p.slug})}" th:text="${p.name}">Name</a>
          </h3>
          <span class="product-price" th:text="'$' + ${p.price}">$0</span>
        </div>
      </article>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="container">
    <p>&copy; 2026 Lumeo</p>
  </div>
</footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
