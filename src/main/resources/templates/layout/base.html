<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${pageTitle} ?: 'Lumeo Shop'">Lumeo Shop</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <th:block th:replace="${headExtra}"></th:block>
</head>
<body>

<!-- ── Navbar ──────────────────────────────────────────────────────────── -->
<nav class="navbar">
  <div class="container nav-inner">
    <a class="brand" th:href="@{/shop}">&#9749; Lumeo</a>

    <form class="search-form" method="get" th:action="@{/shop}">
      <input type="text" name="q" placeholder="Search products…"
             th:value="${query}" class="search-input"/>
      <button type="submit" class="btn btn-primary btn-sm">Search</button>
    </form>

    <ul class="nav-links">
      <li><a th:href="@{/shop}">Shop</a></li>
      <li sec:authorize="isAuthenticated()">
        <a th:href="@{/shop/orders}">My Orders</a>
      </li>
      <li sec:authorize="hasRole('ADMIN')">
        <a th:href="@{/admin}" class="badge-admin">Admin</a>
      </li>
      <li sec:authorize="isAnonymous()">
        <a th:href="@{/login}" class="btn btn-outline btn-sm">Login</a>
      </li>
      <li sec:authorize="isAuthenticated()">
        <form method="post" th:action="@{/logout}" style="display:inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button class="btn btn-outline btn-sm" type="submit">Logout</button>
        </form>
      </li>
    </ul>
  </div>
</nav>

<!-- ── Flash messages ──────────────────────────────────────────────────── -->
<div class="container" th:if="${successMessage}">
  <div class="alert alert-success" th:text="${successMessage}"></div>
</div>
<div class="container" th:if="${errorMessage}">
  <div class="alert alert-error" th:text="${errorMessage}"></div>
</div>

<!-- ── Page content ────────────────────────────────────────────────────── -->
<main class="container main-content">
  <th:block th:replace="${content}"></th:block>
</main>

<footer class="footer">
  <div class="container">
    <p>&copy; 2026 Lumeo &mdash; Senior Spring Boot Demo</p>
    <p>
      <a th:href="@{/swagger-ui.html}">Swagger UI</a> &nbsp;|&nbsp;
      <a th:href="@{/h2-console}">H2 Console</a> &nbsp;|&nbsp;
      <a th:href="@{/actuator/health}">Health</a>
    </p>
  </div>
</footer>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
